<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1170 520" role="img" aria-labelledby="wiring-title">
<style>
svg { --bg: #faf9f7; --surface: #ffffff; --text: #1f1e1c; --muted: #6b6862; --border: #e3e0da;
    --wire: #3a3835; --rail-pos: #c0392b; --rail-gnd: #2c3e50; --signal: #2471a3; --part-fill: #ffffff;
    --code-bg: #f1efeb; }
@media (prefers-color-scheme: dark) { svg { --bg: #161514; --surface: #1f1e1c; --text: #ece9e4; --muted: #a29e97; --border: #3a3835;
      --wire: #c9c5be; --rail-pos: #e5675a; --rail-gnd: #8fb3d1; --signal: #6fb1e0; --part-fill: #1f1e1c;
      --code-bg: #2a2826; } }
svg text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; fill: var(--text); }
svg .lbl { font-size: 13px; }
svg .sub { font-size: 11px; fill: var(--muted); }
svg .title { font-size: 14px; font-weight: 600; }
svg .w { stroke: var(--wire); stroke-width: 2; fill: none; }
svg .pos { stroke: var(--rail-pos); stroke-width: 3; fill: none; }
svg .gnd { stroke: var(--rail-gnd); stroke-width: 3; fill: none; }
svg .sig { stroke: var(--signal); stroke-width: 2; fill: none; }
svg .part { stroke: var(--wire); stroke-width: 2; fill: var(--part-fill); }
svg .block { stroke: var(--wire); stroke-width: 1.5; fill: var(--surface); }
svg .dot { fill: var(--wire); }
svg .solid { fill: var(--wire); stroke: none; }
svg .lbl-pos { fill: var(--rail-pos); font-size: 12px; font-weight: 600; }
svg .lbl-gnd { fill: var(--rail-gnd); font-size: 12px; font-weight: 600; }
svg .pcb { fill: #1f5fae; stroke: #123d73; stroke-width: 1.5; }
svg .hole { fill: #0b2240; }
svg .pad { fill: #d4b04c; stroke: #8a6d1f; stroke-width: 1; }
svg .chip { fill: #1e1e1e; }
svg .metal { fill: #c9cdd2; stroke: #7d838a; stroke-width: 1; }
svg .legs { stroke: #c9cdd2; stroke-width: 3; fill: none; }
svg .cap-top { fill: #2a2a2a; stroke: #9aa0a6; stroke-width: 2; }
svg .cap-vent { stroke: #9aa0a6; stroke-width: 1.5; fill: none; }
svg .ferrite { fill: #3b3b3b; }
svg .copper { fill: none; stroke: #b87333; stroke-width: 9; }
svg .pot { fill: #2f7fe0; stroke: #1a4f99; stroke-width: 1; }
svg .brass { fill: #d4a52a; }
svg .slot { stroke: #6b5210; stroke-width: 1.5; }
svg .led-g { fill: #3cbf5a; }
svg .led-o { fill: #f0a030; }
svg .dot-white { fill: #ddd; }
svg .tab-hole { fill: var(--surface); stroke: #7d838a; stroke-width: 1; }
svg .silk { fill: #ffffff; font-size: 7px; font-weight: 600; }
</style>
<rect width="1170" height="520" fill="var(--bg)"/>
  <title id="wiring-title">Wiring diagram: display light output through fuse and buck converter to a 5 V rail feeding the Pro Mini and the LED strip, switched by an IRL3103 MOSFET, with a blink/steady toggle switch on D2</title>

  <rect class="block" x="30" y="70" width="100" height="150" rx="6"/>
  <text class="title" x="80" y="135" text-anchor="middle">Light output</text>
  <text class="sub" x="80" y="153" text-anchor="middle">from display</text>
  <text class="sub" x="80" y="168" text-anchor="middle">35–42 V</text>
  <text class="lbl-pos" x="118" y="104" text-anchor="end">+</text>
  <text class="lbl-gnd" x="118" y="206" text-anchor="end">−</text>

  <path class="pos" d="M130 110 H170 M230 110 H452"/>
  <rect class="part" x="170" y="101" width="60" height="18" rx="9"/>
  <path class="w" d="M178 110 H222"/>
  <text class="lbl" x="200" y="90" text-anchor="middle">Fuse 1 A slow</text>
  <text class="sub" x="200" y="140" text-anchor="middle">at the tap point</text>

  <path class="gnd" d="M130 190 H452"/>

  <!-- LM2596HV buck module -->
  <rect class="pcb" x="440" y="80" width="200" height="130" rx="4"/>
  <circle class="hole" cx="452" cy="90" r="3.5"/>
  <circle class="hole" cx="628" cy="200" r="3.5"/>
  <rect class="chip" x="470" y="90" width="20" height="10" rx="1"/>
  <rect class="metal" x="486" y="90" width="4" height="10"/>
  <circle class="cap-top" cx="487" cy="152" r="21"/>
  <path class="cap-vent" d="M475 152 H499 M487 140 V164"/>
  <circle class="ferrite" cx="545" cy="122" r="25"/>
  <circle class="copper" cx="545" cy="122" r="17"/>
  <circle class="hole" cx="545" cy="122" r="8"/>
  <rect class="metal" x="521" y="163" width="44" height="8"/>
  <rect class="chip" x="521" y="170" width="44" height="26" rx="1"/>
  <path class="legs" d="M527 196 V203 M535 196 V203 M543 196 V203 M551 196 V203 M559 196 V203"/>
  <text class="silk" x="543" y="186" text-anchor="middle">LM2596HV</text>
  <circle class="cap-top" cx="598" cy="152" r="18"/>
  <path class="cap-vent" d="M588 152 H608 M598 142 V162"/>
  <rect class="pot" x="574" y="86" width="28" height="14" rx="1"/>
  <circle class="brass" cx="597" cy="93" r="4.5"/>
  <path class="slot" d="M594 93 H600"/>
  <circle class="pad" cx="452" cy="110" r="6"/><circle class="hole" cx="452" cy="110" r="2.5"/>
  <circle class="pad" cx="452" cy="190" r="6"/><circle class="hole" cx="452" cy="190" r="2.5"/>
  <circle class="pad" cx="628" cy="110" r="6"/><circle class="hole" cx="628" cy="110" r="2.5"/>
  <circle class="pad" cx="628" cy="190" r="6"/><circle class="hole" cx="628" cy="190" r="2.5"/>
  <text class="silk" x="462" y="124">IN+</text>
  <text class="silk" x="462" y="183">IN−</text>
  <text class="silk" x="618" y="124" text-anchor="end">OUT+</text>
  <text class="silk" x="618" y="183" text-anchor="end">OUT−</text>
  <text class="title" x="540" y="70" text-anchor="middle">LM2596HV buck</text>
  <text class="sub" x="540" y="228" text-anchor="middle">set to 5.0 V · HV only: 60 V in</text>

  <path class="pos" d="M628 110 H1060 V140"/>
  <text class="lbl-pos" x="690" y="100">5 V rail</text>

  <path class="gnd" d="M628 190 H660 V470 H1012"/>
  <text class="lbl-gnd" x="630" y="494">GND (common)</text>

  <!-- Arduino Pro Mini (top view, FTDI header at top) -->
  <rect class="pcb" x="757" y="198" width="96" height="200" rx="3"/>
  <rect class="chip" x="793" y="294" width="24" height="24" transform="rotate(45 805 306)"/>
  <circle class="dot-white" cx="799" cy="306" r="1.5"/>
  <rect class="metal" x="797" y="252" width="16" height="16" rx="2"/>
  <circle class="chip" cx="805" cy="260" r="5"/>
  <rect class="metal" x="796" y="340" width="18" height="8" rx="3"/>
  <rect class="chip" x="797" y="360" width="16" height="10" rx="1"/>
  <rect class="led-g" x="787" y="378" width="6" height="3"/>
  <rect class="led-o" x="817" y="378" width="6" height="3"/>
  <path class="pos" d="M880 110 V274 H843"/>
  <path class="gnd" d="M767 274 H725 V470"/>
  <path class="sig" d="M767 386 H740 V420 H840 M880 420 H988 V385"/>
  <rect class="part" x="840" y="412" width="40" height="16" rx="2"/>
  <text class="sub" x="860" y="446" text-anchor="middle">220 Ω (gate)</text>
  <path class="w" d="M955 420 V430 M955 460 V470"/>
  <rect class="part" x="947" y="430" width="16" height="30" rx="2"/>
  <text class="sub" x="941" y="449" text-anchor="end">10 kΩ</text>
  <circle class="dot" cx="955" cy="420" r="3.5"/>
  <circle class="dot" cx="955" cy="470" r="3.5"/>
  <text class="silk" x="805" y="224" text-anchor="middle">FTDI header</text>
  <rect class="pad" x="771" y="206" width="8" height="8" rx="1"/><circle class="hole" cx="775" cy="210" r="2"/>
  <rect class="pad" x="783" y="206" width="8" height="8" rx="1"/><circle class="hole" cx="787" cy="210" r="2"/>
  <rect class="pad" x="795" y="206" width="8" height="8" rx="1"/><circle class="hole" cx="799" cy="210" r="2"/>
  <rect class="pad" x="807" y="206" width="8" height="8" rx="1"/><circle class="hole" cx="811" cy="210" r="2"/>
  <rect class="pad" x="819" y="206" width="8" height="8" rx="1"/><circle class="hole" cx="823" cy="210" r="2"/>
  <rect class="pad" x="831" y="206" width="8" height="8" rx="1"/><circle class="hole" cx="835" cy="210" r="2"/>
  <rect class="pad" x="763" y="228" width="8" height="8" rx="1"/><circle class="hole" cx="767" cy="232" r="2"/>
  <text class="silk" x="776" y="234.5" text-anchor="start">TXO</text>
  <rect class="pad" x="839" y="228" width="8" height="8" rx="1"/><circle class="hole" cx="843" cy="232" r="2"/>
  <text class="silk" x="834" y="234.5" text-anchor="end">RAW</text>
  <rect class="pad" x="763" y="242" width="8" height="8" rx="1"/><circle class="hole" cx="767" cy="246" r="2"/>
  <text class="silk" x="776" y="248.5" text-anchor="start">RXI</text>
  <rect class="pad" x="839" y="242" width="8" height="8" rx="1"/><circle class="hole" cx="843" cy="246" r="2"/>
  <text class="silk" x="834" y="248.5" text-anchor="end">GND</text>
  <rect class="pad" x="763" y="256" width="8" height="8" rx="1"/><circle class="hole" cx="767" cy="260" r="2"/>
  <text class="silk" x="776" y="262.5" text-anchor="start">RST</text>
  <rect class="pad" x="839" y="256" width="8" height="8" rx="1"/><circle class="hole" cx="843" cy="260" r="2"/>
  <text class="silk" x="834" y="262.5" text-anchor="end">RST</text>
  <rect class="pad" x="763" y="270" width="8" height="8" rx="1"/><circle class="hole" cx="767" cy="274" r="2"/>
  <text class="silk" x="776" y="276.5" text-anchor="start">GND</text>
  <rect class="pad" x="839" y="270" width="8" height="8" rx="1"/><circle class="hole" cx="843" cy="274" r="2"/>
  <text class="silk" x="834" y="276.5" text-anchor="end">VCC</text>
  <rect class="pad" x="763" y="284" width="8" height="8" rx="1"/><circle class="hole" cx="767" cy="288" r="2"/>
  <text class="silk" x="776" y="290.5" text-anchor="start">2</text>
  <rect class="pad" x="839" y="284" width="8" height="8" rx="1"/><circle class="hole" cx="843" cy="288" r="2"/>
  <text class="silk" x="834" y="290.5" text-anchor="end">A3</text>
  <rect class="pad" x="763" y="298" width="8" height="8" rx="1"/><circle class="hole" cx="767" cy="302" r="2"/>
  <text class="silk" x="776" y="304.5" text-anchor="start">3</text>
  <rect class="pad" x="839" y="298" width="8" height="8" rx="1"/><circle class="hole" cx="843" cy="302" r="2"/>
  <text class="silk" x="834" y="304.5" text-anchor="end">A2</text>
  <rect class="pad" x="763" y="312" width="8" height="8" rx="1"/><circle class="hole" cx="767" cy="316" r="2"/>
  <text class="silk" x="776" y="318.5" text-anchor="start">4</text>
  <rect class="pad" x="839" y="312" width="8" height="8" rx="1"/><circle class="hole" cx="843" cy="316" r="2"/>
  <text class="silk" x="834" y="318.5" text-anchor="end">A1</text>
  <rect class="pad" x="763" y="326" width="8" height="8" rx="1"/><circle class="hole" cx="767" cy="330" r="2"/>
  <text class="silk" x="776" y="332.5" text-anchor="start">5</text>
  <rect class="pad" x="839" y="326" width="8" height="8" rx="1"/><circle class="hole" cx="843" cy="330" r="2"/>
  <text class="silk" x="834" y="332.5" text-anchor="end">A0</text>
  <rect class="pad" x="763" y="340" width="8" height="8" rx="1"/><circle class="hole" cx="767" cy="344" r="2"/>
  <text class="silk" x="776" y="346.5" text-anchor="start">6</text>
  <rect class="pad" x="839" y="340" width="8" height="8" rx="1"/><circle class="hole" cx="843" cy="344" r="2"/>
  <text class="silk" x="834" y="346.5" text-anchor="end">13</text>
  <rect class="pad" x="763" y="354" width="8" height="8" rx="1"/><circle class="hole" cx="767" cy="358" r="2"/>
  <text class="silk" x="776" y="360.5" text-anchor="start">7</text>
  <rect class="pad" x="839" y="354" width="8" height="8" rx="1"/><circle class="hole" cx="843" cy="358" r="2"/>
  <text class="silk" x="834" y="360.5" text-anchor="end">12</text>
  <rect class="pad" x="763" y="368" width="8" height="8" rx="1"/><circle class="hole" cx="767" cy="372" r="2"/>
  <text class="silk" x="776" y="374.5" text-anchor="start">8</text>
  <rect class="pad" x="839" y="368" width="8" height="8" rx="1"/><circle class="hole" cx="843" cy="372" r="2"/>
  <text class="silk" x="834" y="374.5" text-anchor="end">11</text>
  <rect class="pad" x="763" y="382" width="8" height="8" rx="1"/><circle class="hole" cx="767" cy="386" r="2"/>
  <text class="silk" x="776" y="388.5" text-anchor="start">9</text>
  <rect class="pad" x="839" y="382" width="8" height="8" rx="1"/><circle class="hole" cx="843" cy="386" r="2"/>
  <text class="silk" x="834" y="388.5" text-anchor="end">10</text>
  <!-- Mode toggle switch, D2 to GND -->
  <path class="sig" d="M767 288 H745 V300"/>
  <path class="w" d="M745 300 V306 M745 324 V340 H725"/>
  <circle class="dot" cx="745" cy="306" r="2.5"/>
  <circle class="dot" cx="745" cy="324" r="2.5"/>
  <path class="w" d="M745 324 L735 308"/>
  <circle class="dot" cx="725" cy="340" r="3.5"/>
  <text class="sub" x="719" y="312" text-anchor="end">Mode</text>
  <text class="sub" x="719" y="326" text-anchor="end">switch</text>
  <circle class="dot" cx="880" cy="110" r="4"/>
  <circle class="dot" cx="725" cy="470" r="4"/>
  <text class="title" x="805" y="170" text-anchor="middle">Arduino Pro Mini</text>
  <text class="sub" x="805" y="186" text-anchor="middle">5 V / 16 MHz</text>

  <rect class="part" x="1051" y="140" width="18" height="70" rx="2"/>
  <text class="lbl" x="1078" y="172">10 Ω</text>
  <text class="sub" x="1078" y="188">≥ 2 W</text>

  <path class="w" d="M1060 210 V240 M1060 272 V405 H1000 V385"/>
  <polygon class="solid" points="1046,242 1074,242 1060,268"/>
  <path class="w" d="M1045 270 H1075"/>
  <path class="w" d="M1078 250 l10 -8 M1082 258 l10 -8"/>
  <text class="title" x="1042" y="250" text-anchor="end">+</text>
  <text class="title" x="1042" y="276" text-anchor="end">−</text>
  <text class="lbl" x="1096" y="252">LED strip</text>
  <text class="sub" x="1096" y="268">red, ~2 V</text>

  <!-- IRL3103, TO-220, printed face towards you -->
  <path class="gnd" d="M1012 470 V411 a6 6 0 0 0 0 -12 V385"/>
  <rect class="metal" x="978" y="290" width="44" height="24" rx="2"/>
  <circle class="tab-hole" cx="1000" cy="301" r="5"/>
  <rect class="chip" x="976" y="312" width="48" height="40" rx="2"/>
  <text class="silk" x="1000" y="329" text-anchor="middle">IRL3103</text>
  <text class="silk" x="988" y="346" text-anchor="middle">G</text>
  <text class="silk" x="1000" y="346" text-anchor="middle">D</text>
  <text class="silk" x="1012" y="346" text-anchor="middle">S</text>
  <rect class="metal" x="986" y="352" width="4" height="33"/>
  <rect class="metal" x="998" y="352" width="4" height="33"/>
  <rect class="metal" x="1010" y="352" width="4" height="33"/>
  <circle class="dot" cx="988" cy="385" r="3"/>
  <circle class="dot" cx="1000" cy="385" r="3"/>
  <circle class="dot" cx="1012" cy="385" r="3"/>
  <text class="lbl" x="968" y="312" text-anchor="end">IRL3103</text>
  <text class="sub" x="968" y="328" text-anchor="end">face towards you</text>
  <text class="sub" x="968" y="343" text-anchor="end">tab = drain</text>
</svg>